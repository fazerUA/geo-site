# Decap CMS — правки попадают в git (backend ниже). См. docs/DECAP-ADMIN.md
backend:
  name: github
  repo: fazerUA/geo-site
  branch: main
  open_authoring: false
  # Beget ≠ Netlify: без base_url Decap откроет api.netlify.com → 404. См. docs/DECAP-GITHUB-OAUTH.md
  # base_url: https://YOUR-NAME.workers.dev
  # auth_endpoint: auth

# Локально: npm run cms:proxy + npm run dev → правки в файлах без GitHub (см. docs/DECAP-ADMIN.md)
local_backend:
  url: http://localhost:8081/api/v1
  allowed_hosts: ["localhost", "127.0.0.1"]

media_folder: public/img
public_folder: /img

site_url: https://art-web-geo.ru
display_url: https://art-web-geo.ru
locale: ru

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: landing
    label: Лендинг (главная)
    files:
      - label: Тарифы
        name: pricing
        file: content/cms/pricing-plans.json
        fields:
          - label: Тарифы
            name: pricingPlans
            widget: list
            min: 1
            fields:
              - { label: Название, name: name, widget: string }
              - { label: Цена (текст), name: price, widget: string }
              - { label: Цена (число для schema), name: priceValue, widget: number }
              - { label: Подпись под названием, name: label, widget: string }
              - { label: Выделенный тариф, name: featured, widget: boolean, default: false }
              - label: Пункты списка
                name: features
                widget: list
                field: { label: Пункт, name: item, widget: string }
      - label: FAQ
        name: faq
        file: content/cms/faq-items.json
        fields:
          - label: Вопросы и ответы
            name: faqItems
            widget: list
            min: 1
            fields:
              - { label: Вопрос, name: q, widget: string }
              - { label: Ответ, name: a, widget: text }
      - label: Кейсы
        name: cases
        file: content/cms/cases-items.json
        fields:
          - label: Кейсы
            name: casesItems
            widget: list
            min: 1
            fields:
              - { label: Заголовок, name: title, widget: string }
              - { label: Ниша, name: niche, widget: string }
              - { label: Результат, name: result, widget: string }
              - { label: Текст, name: text, widget: text }
              - { label: Ссылка на проект, name: projectUrl, widget: string, required: false }
              - label: Картинки в модалке
                name: modalImages
                widget: list
                required: false
                field: { label: Путь, name: path, widget: string }

  - name: blog
    label: Блог
    label_singular: Статья
    folder: content/blog
    path: "{{slug}}"
    create: true
    delete: false
    extension: md
    format: yaml-frontmatter
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title, pinned]
    fields:
      - label: Заголовок
        name: title
        widget: string
      - label: URL (slug, латиница)
        name: slug
        widget: string
        hint: "Имя файла без .md, например rabotaet-li-geo-prodvizhenie"
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', "только a-z, 0-9 и дефис"]
      - label: Дата публикации
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        default: now
      - label: Дата изменения (необяз.)
        name: updated
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        required: false
      - label: Краткое описание (excerpt)
        name: excerpt
        widget: text
      - label: Meta title
        name: metaTitle
        widget: string
        required: false
      - label: Meta description
        name: metaDescription
        widget: text
        required: false
      - label: Закрепить вверху списка
        name: pinned
        widget: boolean
        default: false
      - label: Теги (через запятую)
        name: tags
        widget: string
        hint: "GEO, нейросети, бизнес"
      - label: Автор
        name: author
        widget: select
        options:
          - "Леонид К."
          - "Андрей Ильницкий"
          - "Андрей Григорьев"
        default: "Леонид К."
      - label: Источники
        name: sources
        widget: text
        required: false
        hint: "Название|https://url, через запятую"
      - label: Обложка (путь)
        name: image
        widget: string
        required: false
        hint: "/img/slug.webp — файл загрузите через «Медиа» или положите в public/img"
      - label: Текст статьи
        name: body
        widget: markdown
