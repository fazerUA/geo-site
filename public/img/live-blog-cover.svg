<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#3a7bd5"/>
    </linearGradient>
    <linearGradient id="live" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff416c"/>
      <stop offset="100%" style="stop-color:#ff4b2b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="420" y1="0" x2="420" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="540" y1="0" x2="540" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="660" y1="0" x2="660" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="780" y1="0" x2="780" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="840" y1="0" x2="840" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1020" y1="0" x2="1020" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1080" y1="0" x2="1080" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1140" y1="0" x2="1140" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="480" x2="1200" y2="480" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="1050" cy="120" r="180" fill="url(#accent)" opacity="0.08"/>
  <circle cx="150" cy="520" r="120" fill="url(#live)" opacity="0.08"/>

  <!-- LIVE badge -->
  <rect x="80" y="80" width="130" height="48" rx="24" fill="url(#live)"/>
  <circle cx="110" cy="104" r="8" fill="#fff"/>
  <text x="135" y="112" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#fff" letter-spacing="2">LIVE</text>

  <!-- Main headline -->
  <text x="80" y="200" font-family="Arial, sans-serif" font-weight="bold" font-size="52" fill="#ffffff" letter-spacing="-1">
    <tspan>Live Blog</tspan>
  </text>
  <text x="80" y="260" font-family="Arial, sans-serif" font-weight="bold" font-size="52" fill="url(#accent)" letter-spacing="-1">
    <tspan>для SEO</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="320" font-family="Arial, sans-serif" font-size="24" fill="#a0a0c0">
    <tspan>Как обойти конкурента в поиске</tspan>
  </text>
  <text x="80" y="355" font-family="Arial, sans-serif" font-size="24" fill="#a0a0c0">
    <tspan>и нейросетях</tspan>
  </text>

  <!-- Browser mockup -->
  <g transform="translate(680, 140)">
    <!-- Browser window -->
    <rect width="440" height="320" rx="12" fill="#1a1a2e" stroke="#3a3a5c" stroke-width="2"/>
    <!-- Title bar -->
    <rect width="440" height="40" rx="12" fill="#16162a"/>
    <rect y="28" width="440" height="12" fill="#16162a"/>
    <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="20" r="6" fill="#28ca41"/>
    <!-- URL bar -->
    <rect x="90" y="10" width="280" height="20" rx="10" fill="#0d0d1a"/>
    <text x="110" y="24" font-family="monospace" font-size="10" fill="#666">yoursite.com/live-news</text>

    <!-- Content lines -->
    <g transform="translate(24, 60)">
      <!-- Timestamp -->
      <rect width="80" height="16" rx="4" fill="url(#live)" opacity="0.3"/>
      <text x="10" y="12" font-family="monospace" font-size="9" fill="#ff416c">14:32 LIVE</text>

      <!-- News item 1 -->
      <rect y="28" width="380" height="40" rx="6" fill="#0d0d1a"/>
      <rect y="36" width="200" height="8" rx="4" fill="#3a3a5c"/>
      <rect y="52" width="300" height="6" rx="3" fill="#2a2a4a"/>
      <rect y="62" width="160" height="6" rx="3" fill="#2a2a4a"/>

      <!-- News item 2 -->
      <rect y="80" width="380" height="40" rx="6" fill="#0d0d1a"/>
      <rect y="88" width="180" height="8" rx="4" fill="#3a3a5c"/>
      <rect y="104" width="260" height="6" rx="3" fill="#2a2a4a"/>
      <rect y="114" width="320" height="6" rx="3" fill="#2a2a4a"/>

      <!-- News item 3 - highlighted -->
      <rect y="132" width="380" height="50" rx="6" fill="#1a1a3e" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="4"/>
      <rect y="140" width="220" height="8" rx="4" fill="#3a7bd5" opacity="0.6"/>
      <rect y="156" width="280" height="6" rx="3" fill="#2a2a4a"/>
      <rect y="168" width="200" height="6" rx="3" fill="#2a2a4a"/>

      <!-- Pulse indicator -->
      <circle cx="390" cy="157" r="6" fill="#28ca41"/>
      <circle cx="390" cy="157" r="6" fill="#28ca41" opacity="0.4">
        <animate attributeName="r" values="6;12;6" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Bottom stats -->
  <g transform="translate(80, 430)">
    <!-- Stat 1 -->
    <rect width="200" height="80" rx="10" fill="#1a1a2e" stroke="#3a3a5c" stroke-width="1"/>
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#accent)">+247%</text>
    <text x="20" y="58" font-family="Arial, sans-serif" font-size="12" fill="#8080a0">трафика в Top Stories</text>

    <!-- Stat 2 -->
    <rect x="230" width="200" height="80" rx="10" fill="#1a1a2e" stroke="#3a3a5c" stroke-width="1"/>
    <text x="250" y="35" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#live)">x5</text>
    <text x="250" y="58" font-family="Arial, sans-serif" font-size="12" fill="#8080a0">чаще индексируется</text>

    <!-- Stat 3 -->
    <rect x="460" width="200" height="80" rx="10" fill="#1a1a2e" stroke="#3a3a5c" stroke-width="1"/>
    <text x="480" y="35" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#28ca41">#1</text>
    <text x="480" y="58" font-family="Arial, sans-serif" font-size="12" fill="#8080a0">в рекомендациях AI</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="14" fill="#505070" text-anchor="middle" letter-spacing="4">SEO · GEO · LIVE BLOG</text>
</svg>
