stages:
  - verify
  - build
  - deploy

default:
  image: node:22-bookworm
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

verify:
  stage: verify
  script:
    - npm ci
    - npm run lint

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - out/
    expire_in: 1 week

deploy:
  stage: deploy
  image: alpine:3.20
  needs:
    - build
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r\n' | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
    - printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ls out | head
    - ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" "mkdir -p -- $DEPLOY_PATH"
    - rsync -azO --no-perms --no-owner --no-group --delete --exclude='.ssh/' --exclude='.bash_history' --exclude='admin/.htaccess' -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" out/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
    - ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" "stat -c '%y %n' -- $DEPLOY_PATH/index.html"
  when: on_success
