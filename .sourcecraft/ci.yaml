# Проверка сборки при push. Деплой на хостинг — вручную (см. docs/MANUAL-DEPLOY.md).

on:
  push:
    - workflows: verify-build
      filter:
        branches: ["main", "master"]

workflows:
  verify-build:
    settings:
      max_cube_duration: 30m
    tasks:
      - name: build
        cubes:
          - name: npm-build
            image: docker.io/library/node:22-bookworm
            script:
              - npm ci
              - npm run build
