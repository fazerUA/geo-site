# SourceCraft CI: Directus → static build → FTP
# Секреты: DIRECTUS_URL, DIRECTUS_TOKEN, FTP_HOST, FTP_USER, FTP_PASSWORD, FTP_REMOTE_DIR, FTP_SECURE

on:
  push:
    - workflows: deploy-site
      filter:
        branches: ["main", "master"]
  schedule:
    - workflows: deploy-site
      cron: "*/10 * * * *"

workflows:
  deploy-site:
    settings:
      max_cube_duration: 30m
    tasks:
      - name: build-and-deploy
        env:
          DIRECTUS_URL: ${{ secrets.DIRECTUS_URL }}
          DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_TOKEN }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          FTP_SECURE: ${{ secrets.FTP_SECURE }}
        cubes:
          - name: npm-build-deploy
            image: docker.io/library/node:22-bookworm
            script:
              - npm ci
              - npm run build
              - npm run deploy:ftp
